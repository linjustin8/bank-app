[project]
name = "bank-app-backend"
version = "0.1.0"
description = "FastAPI backend for bank-app"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "clerk-backend-api>=7.0.0",
    "fastapi[standard]>=0.141.1,<0.142",
    "httpx>=0.28.1",
    "pyjwt[crypto]>=2.14.0",
    "pymongo[srv]>=4.18.1",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
]

[tool.fastapi]
entrypoint = "main:app"
